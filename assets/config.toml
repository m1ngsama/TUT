# TUT Configuration File
# Place in ~/.config/tut/config.toml

[general]
# Default theme name (must exist in themes directory)
theme = "default"

# Default homepage URL
homepage = "about:blank"

# Enable debug logging
debug = false

[browser]
# HTTP request timeout in seconds
timeout = 30

# Maximum redirects to follow
max_redirects = 10

# User agent string
user_agent = "TUT/0.1.0 (Terminal Browser)"

# Enable cookies
cookies = true

[cache]
# Enable page caching
enabled = true

# Maximum cache size in MB
max_size = 100

# Cache expiration in minutes
expiration = 60

[history]
# Maximum history entries
max_entries = 1000

# Save history on exit
save_on_exit = true

[bookmarks]
# Auto-save bookmarks
auto_save = true

[ui]
# Show line numbers in content
line_numbers = false

# Wrap long lines
word_wrap = true

# Show images as ASCII art (requires stb_image)
show_images = true

# Status bar position (top, bottom)
status_position = "bottom"

[keybindings]
# Keybinding preset (default, vim, emacs)
preset = "default"
