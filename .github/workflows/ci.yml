name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stable-ubuntu:
    name: Rust 1.97.1 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed 2026-07-18
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: RUSTFLAGS="-C overflow-checks=on" cargo test --release --all-targets --locked
      - run: |
          RUSTFLAGS="-C overflow-checks=on" make bounded-results > "$RUNNER_TEMP/tut-bounds-v1.ndjson"
          cat "$RUNNER_TEMP/tut-bounds-v1.ndjson"
      - run: make distcheck

  msrv-ubuntu:
    name: Rust 1.88.0 / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed 2026-07-18
        with:
          toolchain: 1.88.0
          components: clippy
      - run: cargo +1.88.0 clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.88.0 test --all-targets --locked

  stable-macos:
    name: Rust 1.97.1 / macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed 2026-07-18
        with:
          toolchain: 1.97.1
      - run: cargo test --all-targets --locked
