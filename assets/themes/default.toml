# TUT Default Theme (Dark)
# Inspired by btop's dark theme

[meta]
name = "default"
description = "Default dark theme with btop-style colors"

[colors]
background = "#1e1e2e"
foreground = "#cdd6f4"
accent = "#89b4fa"
border = "#45475a"
selection = "#313244"
link = "#74c7ec"
visited_link = "#b4befe"
error = "#f38ba8"
success = "#a6e3a1"
warning = "#f9e2af"

[ui]
border_style = "rounded"
show_shadows = false
transparency = false
