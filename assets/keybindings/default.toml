# TUT Default Keybindings
# Vim-style navigation with function key shortcuts

[navigation]
scroll_up = ["k", "Up"]
scroll_down = ["j", "Down"]
page_up = ["b", "Shift+Space"]
page_down = ["Space"]
top = ["g"]
bottom = ["G"]
back = ["Backspace", "Alt+Left"]
forward = ["Alt+Right"]
refresh = ["r", "F5"]

[links]
next_link = ["Tab"]
prev_link = ["Shift+Tab"]
follow_link = ["Enter"]
link_1 = ["1"]
link_2 = ["2"]
link_3 = ["3"]
link_4 = ["4"]
link_5 = ["5"]
link_6 = ["6"]
link_7 = ["7"]
link_8 = ["8"]
link_9 = ["9"]

[search]
start_search = ["/"]
next_result = ["n"]
prev_result = ["N"]

[ui]
focus_address_bar = ["Ctrl+l"]
show_help = ["F1", "?"]
show_bookmarks = ["F2"]
show_history = ["F3"]
show_settings = ["F4"]
add_bookmark = ["Ctrl+d"]
quit = ["Ctrl+q", "F10", "q"]

[forms]
focus_form = ["i"]
next_field = ["Tab"]
prev_field = ["Shift+Tab"]
submit = ["Enter"]
cancel = ["Escape"]
