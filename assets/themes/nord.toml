# TUT Nord Theme
# Based on Nord color palette

[meta]
name = "nord"
description = "Nord color palette theme"

[colors]
background = "#2e3440"
foreground = "#d8dee9"
accent = "#88c0d0"
border = "#4c566a"
selection = "#434c5e"
link = "#81a1c1"
visited_link = "#b48ead"
error = "#bf616a"
success = "#a3be8c"
warning = "#ebcb8b"

[ui]
border_style = "rounded"
show_shadows = false
transparency = false
