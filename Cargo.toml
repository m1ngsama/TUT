[package]
name = "tut"
version = "0.0.1"
edition = "2024"
rust-version = "1.88.0"
publish = false
license = "MIT"
repository = "https://github.com/m1ngsama/TUT"
description = "A local plain-text reader for the terminal"

[dependencies]
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
rustix = { version = "1", features = ["fs"] }
signal-hook = "0.3"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }
tempfile = "3"
