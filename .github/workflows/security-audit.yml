name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustsec:
    name: RustSec / Cargo.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # reviewed 2026-07-18
        with:
          toolchain: 1.88.0
      - name: Install cargo-audit
        run: cargo +1.88.0 install cargo-audit --locked --version '=0.22.2'
      - name: Audit locked dependencies
        run: cargo +1.88.0 audit --file Cargo.lock
