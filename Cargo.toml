[package]
name = "tut"
version = "0.0.6"
edition = "2024"
rust-version = "1.88.0"
publish = false
license = "MIT"
repository = "https://github.com/m1ngsama/TUT"
homepage = "https://github.com/m1ngsama/TUT"
readme = "README.md"
description = "A local text and EPUB reader for the terminal"

[dependencies]
libc = "0.2"
percent-encoding = "2"
quick-xml = { version = "0.41", features = ["escape-html"] }
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
rbook = { version = "0.7.10", default-features = false }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
unicode-segmentation = "1.13"
unicode-width = "0.2"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rustix = { version = "1", features = ["fs", "process", "pty", "stdio", "termios"] }
